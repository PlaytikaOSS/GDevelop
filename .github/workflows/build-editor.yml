# Build the GDevelop desktop editor for Windows and/or macOS on demand from any
# ref in this repository.
#
# Pipeline:
#   0) prep (Linux): normalizes inputs so the rest of the workflow has a single
#      source of truth regardless of whether the run was triggered via
#      workflow_dispatch or via push (push events do not populate inputs.*).
#   1) build-gdevelop-js (Linux): compiles GDevelop.js (libGD.js / libGD.wasm)
#      with Emscripten - same pin as .travis.yml / CircleCI (emsdk 3.1.21).
#      Also computes the build version = <upstream>-beta.<run_number>.
#   2) build-editor-windows and/or build-editor-macos (parallel, gated by
#      the prep outputs): each job downloads the libGD-js artifact, places it
#      under Binaries/embuild/GDevelop.js so newIDE/app/scripts/import-libGD.js
#      uses the local-build path, stamps the build version into
#      newIDE/electron-app/app/package.json, installs a minimal shelljs in
#      GDevelop.js/ for copy-to-newIDE.js, then runs electron-builder
#      (Windows: default targets; macOS: --mac).
#
# Inputs (workflow_dispatch only):
#   - source_ref    : any branch/tag/SHA in this repo, used for all checkouts.
#                     The workflow YAML itself is always read from the ref the
#                     workflow is dispatched on (ci-editor-build); source_ref
#                     decides what code we actually build.
#   - build_windows : run the Windows job (default true).
#   - build_macos   : run the macOS job (default true).
#   - dryRun        : skip heavy steps (emsdk, libGD build, npm installs,
#                     electron-builder, artifact upload) to exercise only
#                     workflow orchestration. Default false for manual runs -
#                     click Run workflow and you get a real build.
#
# Push triggers (branch ci-editor-build) are always forced into dryRun=true
# with both platforms enabled and source_ref = the pushed branch. This keeps
# the workflow registered in the UI without burning minutes on every commit.
#
# Not intended to be merged to master - lives on the `ci-editor-build` branch
# only so upstream sync is not disturbed.

name: Build Editor (Windows & macOS)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch / tag / SHA to build (any ref in this repo)"
        required: true
        type: string
        default: ci-editor-build
      build_windows:
        description: "Build Windows installer"
        required: false
        type: boolean
        default: true
      build_macos:
        description: "Build macOS installer"
        required: false
        type: boolean
        default: true
      dryRun:
        description: "Skip heavy steps (libGD / electron-builder / upload); run only orchestration"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - ci-editor-build

# Emscripten SDK version is pinned everywhere in the project.
env:
  EMSDK_VERSION: "3.1.21"

jobs:
  # Normalize inputs so both workflow_dispatch and push events produce a
  # consistent set of outputs. push events never populate inputs.* - without
  # this job every `fromJSON(inputs.X)` below would fail on push.
  prep:
    name: Prepare inputs
    runs-on: ubuntu-24.04
    outputs:
      source_ref: ${{ steps.normalize.outputs.source_ref }}
      build_windows: ${{ steps.normalize.outputs.build_windows }}
      build_macos: ${{ steps.normalize.outputs.build_macos }}
      dry_run: ${{ steps.normalize.outputs.dry_run }}
    steps:
      - id: normalize
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_SOURCE_REF: ${{ inputs.source_ref }}
          IN_BUILD_WINDOWS: ${{ inputs.build_windows }}
          IN_BUILD_MACOS: ${{ inputs.build_macos }}
          IN_DRY_RUN: ${{ inputs.dryRun }}
          PUSH_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            src="$PUSH_REF_NAME"
            win="true"
            mac="true"
            dry="true"
          else
            src="$IN_SOURCE_REF"
            win="$IN_BUILD_WINDOWS"
            mac="$IN_BUILD_MACOS"
            dry="$IN_DRY_RUN"
          fi
          {
            echo "source_ref=$src"
            echo "build_windows=$win"
            echo "build_macos=$mac"
            echo "dry_run=$dry"
          } >> "$GITHUB_OUTPUT"
          echo "Normalized: event=$EVENT_NAME source_ref=$src build_windows=$win build_macos=$mac dry_run=$dry"

  build-gdevelop-js:
    name: Build GDevelop.js (Linux)
    needs: prep
    # Skip entirely if neither platform is selected - nothing would consume libGD.
    if: ${{ fromJSON(needs.prep.outputs.build_windows) || fromJSON(needs.prep.outputs.build_macos) }}
    runs-on: ubuntu-24.04
    outputs:
      build_version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prep.outputs.source_ref }}
          fetch-depth: 1

      # Version format: <upstream>-beta.<github.run_number>. Upstream base is read
      # from newIDE/electron-app/app/package.json of the checked-out source_ref.
      # This step is intentionally cheap and always runs (even in dryRun mode) so
      # downstream jobs can consume the output for validation.
      - name: Compute build version
        id: version
        shell: bash
        run: |
          base=$(node -p "require('./newIDE/electron-app/app/package.json').version")
          value="${base}-beta.${{ github.run_number }}"
          echo "value=${value}" >> "$GITHUB_OUTPUT"
          echo "Build version: ${value}"

      - name: Install system build deps
        if: ${{ !fromJSON(needs.prep.outputs.dry_run) }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake p7zip-full libstdc++-14-dev

      - uses: actions/setup-node@v4
        if: ${{ !fromJSON(needs.prep.outputs.dry_run) }}
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: GDevelop.js/package-lock.json

      - name: Install Emscripten ${{ env.EMSDK_VERSION }}
        if: ${{ !fromJSON(needs.prep.outputs.dry_run) }}
        run: |
          git clone --depth 1 --branch ${{ env.EMSDK_VERSION }} https://github.com/juj/emsdk.git
          cd emsdk
          ./emsdk install ${{ env.EMSDK_VERSION }}
          ./emsdk activate ${{ env.EMSDK_VERSION }}

      - name: Install GDevelop.js npm deps
        if: ${{ !fromJSON(needs.prep.outputs.dry_run) }}
        run: npm install
        working-directory: GDevelop.js

      - name: Build GDevelop.js
        if: ${{ !fromJSON(needs.prep.outputs.dry_run) }}
        shell: bash
        run: |
          source ../emsdk/emsdk_env.sh
          npm run build
        working-directory: GDevelop.js

      # Stage libGD.js and libGD.wasm into a dedicated folder so the artifact
      # archive is guaranteed to contain them at its root (no LCA ambiguity
      # from actions/upload-artifact@v4 with multiple absolute-ish paths).
      - name: Stage libGD artifact
        if: ${{ !fromJSON(needs.prep.outputs.dry_run) }}
        run: |
          mkdir -p libGD-artifact
          cp Binaries/embuild/GDevelop.js/libGD.js  libGD-artifact/
          cp Binaries/embuild/GDevelop.js/libGD.wasm libGD-artifact/
          ls -la libGD-artifact/

      - name: Upload libGD.js artifact
        if: ${{ !fromJSON(needs.prep.outputs.dry_run) }}
        uses: actions/upload-artifact@v4
        with:
          name: libGD-js
          path: libGD-artifact/
          retention-days: 90
          if-no-files-found: error

      - name: Dry-run summary
        if: ${{ fromJSON(needs.prep.outputs.dry_run) }}
        shell: bash
        run: |
          echo "DRY RUN: skipped libGD compile and upload."
          echo "  source_ref    = ${{ needs.prep.outputs.source_ref }}"
          echo "  build_version = ${{ steps.version.outputs.value }}"
          echo "  build_windows = ${{ needs.prep.outputs.build_windows }}"
          echo "  build_macos   = ${{ needs.prep.outputs.build_macos }}"

  build-editor-windows:
    name: Build Editor (Windows)
    needs: [prep, build-gdevelop-js]
    if: ${{ fromJSON(needs.prep.outputs.build_windows) }}
    runs-on: windows-latest
    env:
      # React production build runs out of heap without a larger Node heap.
      NODE_OPTIONS: --max-old-space-size=8192
      # Force import-libGD.js to fail instead of silently falling back to
      # master/latest on S3 if our locally-placed libGD.js is missing.
      REQUIRES_EXACT_LIBGD_JS_VERSION: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prep.outputs.source_ref }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        if: ${{ !fromJSON(needs.prep.outputs.dry_run) }}
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: |
            newIDE/app/package-lock.json
            newIDE/electron-app/package-lock.json
            newIDE/electron-app/app/package-lock.json

      # Python 3.12 removed distutils; some native deps pulled by electron-app
      # still require it. setuptools puts distutils back.
      - name: Install setuptools (provides distutils)
        if: ${{ !fromJSON(needs.prep.outputs.dry_run) }}
        run: pip install setuptools

      # Landing the files at Binaries/embuild/GDevelop.js/ makes
      # newIDE/app/scripts/import-libGD.js take the "local build" branch and
      # copy them via GDevelop.js/scripts/copy-to-newIDE.js into
      # newIDE/app/public + newIDE/app/node_modules/libGD.js-for-tests-only.
      - name: Download libGD.js artifact
        if: ${{ !fromJSON(needs.prep.outputs.dry_run) }}
        uses: actions/download-artifact@v4
        with:
          name: libGD-js
          path: Binaries/embuild/GDevelop.js

      # newIDE/app/scripts/import-libGD.js detects the files above and takes the
      # "local build" branch, which shells out to GDevelop.js/scripts/copy-to-newIDE.js.
      # That script `require('shelljs')` - but GDevelop.js/node_modules is empty on
      # this runner (we don't build GDevelop.js here). Install only shelljs, quickly,
      # so the copy step succeeds.
      - name: Install shelljs for GDevelop.js copy script
        if: ${{ !fromJSON(needs.prep.outputs.dry_run) }}
        run: npm install shelljs --no-save --no-package-lock
        working-directory: GDevelop.js

      - name: Install newIDE/app dependencies
        if: ${{ !fromJSON(needs.prep.outputs.dry_run) }}
        run: npm install
        working-directory: newIDE/app

      - name: Install newIDE/electron-app dependencies
        if: ${{ !fromJSON(needs.prep.outputs.dry_run) }}
        run: npm install
        working-directory: newIDE/electron-app

      # electron-builder reads version from newIDE/electron-app/app/package.json
      # (directories.app = 'app' in electron-builder-config.js). Overwrite in-place
      # on the runner; no commit is made back to the repo.
      - name: Stamp build version
        if: ${{ !fromJSON(needs.prep.outputs.dry_run) }}
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.build-gdevelop-js.outputs.build_version }}
        run: |
          node -e "const f='newIDE/electron-app/app/package.json';const p=require('./'+f);p.version=process.env.BUILD_VERSION;require('fs').writeFileSync(f, JSON.stringify(p,null,2)+'\n')"
          echo "Stamped version: $BUILD_VERSION"

      # `--publish=never` prevents electron-builder from attempting to publish
      # to GitHub releases (configured in electron-builder-config.js).
      # No GD_SIGNTOOL_* envs set -> unsigned Windows build.
      - name: Build editor (electron-builder)
        if: ${{ !fromJSON(needs.prep.outputs.dry_run) }}
        run: npm run build -- --publish=never
        working-directory: newIDE/electron-app

      # Ship only the NSIS installer (e.g. "GDevelop 5 Setup 5.6.266-beta.42.exe"),
      # not the unpacked win-unpacked/ tree or auxiliary files.
      - name: Upload editor artifacts
        if: ${{ !fromJSON(needs.prep.outputs.dry_run) }}
        uses: actions/upload-artifact@v4
        with:
          name: gdevelop-editor-windows-${{ needs.build-gdevelop-js.outputs.build_version }}
          path: newIDE/electron-app/dist/*Setup*.exe
          retention-days: 90
          if-no-files-found: error

      - name: Dry-run summary
        if: ${{ fromJSON(needs.prep.outputs.dry_run) }}
        shell: bash
        run: |
          echo "DRY RUN (Windows): skipped installs, stamp, electron-builder and upload."
          echo "  source_ref    = ${{ needs.prep.outputs.source_ref }}"
          echo "  build_version = ${{ needs.build-gdevelop-js.outputs.build_version }}"

  build-editor-macos:
    name: Build Editor (macOS)
    needs: [prep, build-gdevelop-js]
    if: ${{ fromJSON(needs.prep.outputs.build_macos) }}
    runs-on: macos-latest
    env:
      # Mirrors the upstream CircleCI macOS build env.
      NODE_OPTIONS: --max-old-space-size=7168
      # Skip Keychain code-signing lookup; no Developer ID cert on the runner.
      # electron-builder-after-sign.js bails out when APPLEID is unset, so
      # notarization is skipped automatically as well.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Prevent CRA (react-scripts build) from treating warnings as errors
      # when the CI env var is auto-set to true on GitHub Actions.
      CI: "false"
      # Force import-libGD.js to fail instead of silently falling back to
      # master/latest on S3 if our locally-placed libGD.js is missing.
      REQUIRES_EXACT_LIBGD_JS_VERSION: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prep.outputs.source_ref }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        if: ${{ !fromJSON(needs.prep.outputs.dry_run) }}
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: |
            newIDE/app/package-lock.json
            newIDE/electron-app/package-lock.json
            newIDE/electron-app/app/package-lock.json

      # libGD.js / libGD.wasm are platform-independent (WebAssembly), so the
      # Linux-built artifact is reused as-is on macOS.
      - name: Download libGD.js artifact
        if: ${{ !fromJSON(needs.prep.outputs.dry_run) }}
        uses: actions/download-artifact@v4
        with:
          name: libGD-js
          path: Binaries/embuild/GDevelop.js

      # See the Windows job for the rationale.
      - name: Install shelljs for GDevelop.js copy script
        if: ${{ !fromJSON(needs.prep.outputs.dry_run) }}
        run: npm install shelljs --no-save --no-package-lock
        working-directory: GDevelop.js

      - name: Install newIDE/app dependencies
        if: ${{ !fromJSON(needs.prep.outputs.dry_run) }}
        run: npm install
        working-directory: newIDE/app

      - name: Install newIDE/electron-app dependencies
        if: ${{ !fromJSON(needs.prep.outputs.dry_run) }}
        run: npm install
        working-directory: newIDE/electron-app

      # See the Windows job for the rationale.
      - name: Stamp build version
        if: ${{ !fromJSON(needs.prep.outputs.dry_run) }}
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.build-gdevelop-js.outputs.build_version }}
        run: |
          node -e "const f='newIDE/electron-app/app/package.json';const p=require('./'+f);p.version=process.env.BUILD_VERSION;require('fs').writeFileSync(f, JSON.stringify(p,null,2)+'\n')"
          echo "Stamped version: $BUILD_VERSION"

      # `--mac` drives electron-builder to build macOS targets from the config
      # (universal .dmg + .zip per electron-builder-config.js).
      # `--publish=never` keeps electron-builder from trying to upload a release.
      - name: Build editor (electron-builder)
        if: ${{ !fromJSON(needs.prep.outputs.dry_run) }}
        run: npm run build -- --mac --publish=never
        working-directory: newIDE/electron-app

      # Ship only the .dmg installer (universal build); skip the unpacked .app
      # bundle in mac-universal/ and the auxiliary .zip that electron-builder
      # emits next to the .dmg.
      - name: Upload editor artifacts
        if: ${{ !fromJSON(needs.prep.outputs.dry_run) }}
        uses: actions/upload-artifact@v4
        with:
          name: gdevelop-editor-macos-${{ needs.build-gdevelop-js.outputs.build_version }}
          path: newIDE/electron-app/dist/*.dmg
          retention-days: 90
          if-no-files-found: error

      - name: Dry-run summary
        if: ${{ fromJSON(needs.prep.outputs.dry_run) }}
        shell: bash
        run: |
          echo "DRY RUN (macOS): skipped installs, stamp, electron-builder and upload."
          echo "  source_ref    = ${{ needs.prep.outputs.source_ref }}"
          echo "  build_version = ${{ needs.build-gdevelop-js.outputs.build_version }}"
