# Build the GDevelop desktop editor and publish a GitHub prerelease whenever a
# pull request is merged into release/beta-editor.
#
# Pipeline:
#   1) build-gdevelop-js (Linux): compiles GDevelop.js (libGD.js / libGD.wasm)
#      with Emscripten - same pin as .travis.yml / CircleCI (emsdk 3.1.21).
#      Also computes the build version = <upstream>-beta.<run_number>.
#   2) prepare-release (Linux): creates an empty GitHub prerelease tagged
#      v<build_version> with auto-generated release notes (changelog vs the
#      previous release on this repo). Idempotent.
#   3) build-editor-windows + build-editor-macos + build-editor-linux
#      (parallel): each job downloads the libGD-js artifact, places it under
#      Binaries/embuild/GDevelop.js so newIDE/app/scripts/import-libGD.js
#      uses the local-build path, stamps the build version into
#      newIDE/electron-app/app/package.json, installs a minimal shelljs in
#      GDevelop.js/ for copy-to-newIDE.js, then runs electron-builder
#      (Windows: default targets; macOS: --mac; Linux: --linux zip --x64,
#      i.e. only the portable zip, not the AppImage/deb installers - see
#      4ian/GDevelop#8587). Installers/archives are uploaded directly to the
#      prerelease (no standalone workflow artifacts are kept).
#
# Heavy steps (emsdk, libGD build, npm installs, electron-builder, release
# creation, installer upload) are gated by the DRY_RUN env below. Default is
# "false" on this branch so every merge produces installers and a prerelease.
# Set DRY_RUN to "true" temporarily to exercise the workflow without building.
#
# Concurrency: rapid consecutive merges cancel in-flight runs for the same
# target branch - the newest merge is what we want to ship.
#
# Required permissions: contents: write (create tags, releases, upload
# assets). Provided by the default GITHUB_TOKEN on the fork; no PAT needed.
#
# Not intended to be merged to master - lives on the `release/beta-editor`
# branch only so upstream sync is not disturbed. Triggers:
#   - a merged pull request targeting release/beta-editor (a closed-but-not-
#     merged PR, e.g. rejected/closed without merging, is ignored via the
#     per-job `if:` check below);
#   - a direct push to release/beta-editor whose commit message contains the
#     marker "[force-build]" (see the per-job `if:` below) - workflow_dispatch's
#     "Run workflow" button does not show up for workflows that only exist on
#     a non-default branch, so this is the escape hatch to re-run without a
#     throwaway PR (e.g. `git commit --allow-empty -m "[force-build] retry Linux build"`).

name: Build Editor (Windows, macOS & Linux)

on:
  pull_request:
    types: [closed]
    branches:
      - release/beta-editor
  push:
    branches:
      - release/beta-editor

concurrency:
  group: build-editor-${{ github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Emscripten SDK version is pinned everywhere in the project.
  EMSDK_VERSION: "3.1.21"
  # Global toggle: when "true", every heavy step is skipped so the workflow
  # only exercises orchestration (checkouts, version compute, summary steps).
  # Releases are also skipped. Change to "false" to produce real installers
  # and publish the prerelease.
  DRY_RUN: "false"

jobs:
  build-gdevelop-js:
    name: Build GDevelop.js (Linux)
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[force-build]'))
    runs-on: ubuntu-24.04
    outputs:
      build_version: ${{ steps.version.outputs.value }}
    steps:
      # Check out the actual merge commit landed on the base branch (not the
      # ephemeral refs/pull/:number/merge test-merge ref) so the build reflects
      # exactly what is now on release/beta-editor.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 1

      # Version format: <upstream>-beta.<github.run_number>. Upstream base is read
      # from newIDE/electron-app/app/package.json of the checked-out ref.
      # This step is intentionally cheap and always runs (even in dry-run mode) so
      # downstream jobs can consume the output for validation.
      - name: Compute build version
        id: version
        shell: bash
        run: |
          base=$(node -p "require('./newIDE/electron-app/app/package.json').version")
          value="${base}-beta.${{ github.run_number }}"
          echo "value=${value}" >> "$GITHUB_OUTPUT"
          echo "Build version: ${value}"

      - name: Install system build deps
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake p7zip-full libstdc++-14-dev

      - uses: actions/setup-node@v4
        if: ${{ env.DRY_RUN != 'true' }}
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: GDevelop.js/package-lock.json

      - name: Install Emscripten ${{ env.EMSDK_VERSION }}
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          git clone --depth 1 --branch ${{ env.EMSDK_VERSION }} https://github.com/juj/emsdk.git
          cd emsdk
          ./emsdk install ${{ env.EMSDK_VERSION }}
          ./emsdk activate ${{ env.EMSDK_VERSION }}

      - name: Install GDevelop.js npm deps
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm install
        working-directory: GDevelop.js

      - name: Build GDevelop.js
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          source ../emsdk/emsdk_env.sh
          npm run build
        working-directory: GDevelop.js

      # Stage libGD.js and libGD.wasm into a dedicated folder so the artifact
      # archive is guaranteed to contain them at its root (no LCA ambiguity
      # from actions/upload-artifact@v4 with multiple absolute-ish paths).
      - name: Stage libGD artifact
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          mkdir -p libGD-artifact
          cp Binaries/embuild/GDevelop.js/libGD.js  libGD-artifact/
          cp Binaries/embuild/GDevelop.js/libGD.wasm libGD-artifact/
          ls -la libGD-artifact/

      - name: Upload libGD.js artifact
        if: ${{ env.DRY_RUN != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: libGD-js
          path: libGD-artifact/
          retention-days: 90
          if-no-files-found: error

      - name: Dry-run summary
        if: ${{ env.DRY_RUN == 'true' }}
        shell: bash
        run: |
          echo "DRY RUN: skipped libGD compile and upload."
          echo "  build_version = ${{ steps.version.outputs.value }}"

  # Create an empty prerelease up-front so the two parallel platform jobs can
  # both `gh release upload` onto an existing tag without racing on creation.
  # Job-level `if:` cannot reference workflow-level env, so the DRY_RUN guard
  # lives on the steps below - the runner still spins up (~15s) in dry-run but
  # does nothing.
  prepare-release:
    name: Prepare GitHub prerelease
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[force-build]'))
    needs: build-gdevelop-js
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so `--generate-notes` can diff against the previous
      # release for a meaningful changelog.
      - uses: actions/checkout@v4
        if: ${{ env.DRY_RUN != 'true' }}
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - name: Create empty prerelease
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.build-gdevelop-js.outputs.build_version }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, reusing it."
          else
            gh release create "$TAG" \
              --prerelease \
              --title "$TAG" \
              --generate-notes \
              --target "$TARGET_SHA"
          fi

      - name: Dry-run summary
        if: ${{ env.DRY_RUN == 'true' }}
        shell: bash
        run: |
          echo "DRY RUN: skipped release creation."
          echo "  build_version = ${{ needs.build-gdevelop-js.outputs.build_version }}"

  build-editor-windows:
    name: Build Editor (Windows)
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[force-build]'))
    needs: [build-gdevelop-js, prepare-release]
    runs-on: windows-latest
    env:
      # React production build runs out of heap without a larger Node heap.
      NODE_OPTIONS: --max-old-space-size=8192
      # Force import-libGD.js to fail instead of silently falling back to
      # master/latest on S3 if our locally-placed libGD.js is missing.
      REQUIRES_EXACT_LIBGD_JS_VERSION: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        if: ${{ env.DRY_RUN != 'true' }}
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: |
            newIDE/app/package-lock.json
            newIDE/electron-app/package-lock.json
            newIDE/electron-app/app/package-lock.json

      # Python 3.12 removed distutils; some native deps pulled by electron-app
      # still require it. setuptools puts distutils back.
      - name: Install setuptools (provides distutils)
        if: ${{ env.DRY_RUN != 'true' }}
        run: pip install setuptools

      # Landing the files at Binaries/embuild/GDevelop.js/ makes
      # newIDE/app/scripts/import-libGD.js take the "local build" branch and
      # copy them via GDevelop.js/scripts/copy-to-newIDE.js into
      # newIDE/app/public + newIDE/app/node_modules/libGD.js-for-tests-only.
      - name: Download libGD.js artifact
        if: ${{ env.DRY_RUN != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: libGD-js
          path: Binaries/embuild/GDevelop.js

      # newIDE/app/scripts/import-libGD.js detects the files above and takes the
      # "local build" branch, which shells out to GDevelop.js/scripts/copy-to-newIDE.js.
      # That script `require('shelljs')` - but GDevelop.js/node_modules is empty on
      # this runner (we don't build GDevelop.js here). Install only shelljs, quickly,
      # so the copy step succeeds.
      - name: Install shelljs for GDevelop.js copy script
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm install shelljs --no-save --no-package-lock
        working-directory: GDevelop.js

      - name: Install newIDE/app dependencies
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm install
        working-directory: newIDE/app

      - name: Install newIDE/electron-app dependencies
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm install
        working-directory: newIDE/electron-app

      # electron-builder reads version from newIDE/electron-app/app/package.json
      # (directories.app = 'app' in electron-builder-config.js). Overwrite in-place
      # on the runner; no commit is made back to the repo.
      - name: Stamp build version
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.build-gdevelop-js.outputs.build_version }}
        run: |
          node -e "const f='newIDE/electron-app/app/package.json';const p=require('./'+f);p.version=process.env.BUILD_VERSION;require('fs').writeFileSync(f, JSON.stringify(p,null,2)+'\n')"
          echo "Stamped version: $BUILD_VERSION"

      # `--publish=never` prevents electron-builder from attempting to publish
      # to GitHub releases (configured in electron-builder-config.js).
      # No GD_SIGNTOOL_* envs set -> unsigned Windows build.
      - name: Build editor (electron-builder)
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm run build -- --publish=never
        working-directory: newIDE/electron-app

      # Attach only the NSIS installer (e.g. "GDevelop 5 Setup 5.6.266-beta.42.exe"),
      # not the unpacked win-unpacked/ tree or auxiliary files. --clobber makes
      # re-runs of this job safe.
      - name: Attach Windows installer to release
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.build-gdevelop-js.outputs.build_version }}
        shell: bash
        run: |
          gh release upload "$TAG" newIDE/electron-app/dist/*Setup*.exe --clobber

      - name: Dry-run summary
        if: ${{ env.DRY_RUN == 'true' }}
        shell: bash
        run: |
          echo "DRY RUN (Windows): skipped installs, stamp, electron-builder and release upload."
          echo "  build_version = ${{ needs.build-gdevelop-js.outputs.build_version }}"

  build-editor-macos:
    name: Build Editor (macOS)
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[force-build]'))
    needs: [build-gdevelop-js, prepare-release]
    runs-on: macos-latest
    env:
      # Mirrors the upstream CircleCI macOS build env.
      NODE_OPTIONS: --max-old-space-size=7168
      # Skip Keychain code-signing lookup; no Developer ID cert on the runner.
      # electron-builder-after-sign.js bails out when APPLEID is unset, so
      # notarization is skipped automatically as well.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Prevent CRA (react-scripts build) from treating warnings as errors
      # when the CI env var is auto-set to true on GitHub Actions.
      CI: "false"
      # Force import-libGD.js to fail instead of silently falling back to
      # master/latest on S3 if our locally-placed libGD.js is missing.
      REQUIRES_EXACT_LIBGD_JS_VERSION: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        if: ${{ env.DRY_RUN != 'true' }}
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: |
            newIDE/app/package-lock.json
            newIDE/electron-app/package-lock.json
            newIDE/electron-app/app/package-lock.json

      # libGD.js / libGD.wasm are platform-independent (WebAssembly), so the
      # Linux-built artifact is reused as-is on macOS.
      - name: Download libGD.js artifact
        if: ${{ env.DRY_RUN != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: libGD-js
          path: Binaries/embuild/GDevelop.js

      # See the Windows job for the rationale.
      - name: Install shelljs for GDevelop.js copy script
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm install shelljs --no-save --no-package-lock
        working-directory: GDevelop.js

      - name: Install newIDE/app dependencies
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm install
        working-directory: newIDE/app

      - name: Install newIDE/electron-app dependencies
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm install
        working-directory: newIDE/electron-app

      # See the Windows job for the rationale.
      - name: Stamp build version
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.build-gdevelop-js.outputs.build_version }}
        run: |
          node -e "const f='newIDE/electron-app/app/package.json';const p=require('./'+f);p.version=process.env.BUILD_VERSION;require('fs').writeFileSync(f, JSON.stringify(p,null,2)+'\n')"
          echo "Stamped version: $BUILD_VERSION"

      # `--mac` drives electron-builder to build macOS targets from the config
      # (universal .dmg + .zip per electron-builder-config.js).
      # `--publish=never` keeps electron-builder from trying to upload a release.
      - name: Build editor (electron-builder)
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm run build -- --mac --publish=never
        working-directory: newIDE/electron-app

      # Attach only the universal .dmg (per mac.target=universal in
      # electron-builder-config.js); skip mac-universal/ .app bundle and the
      # auxiliary .zip. --clobber makes re-runs of this job safe.
      - name: Attach macOS installer to release
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.build-gdevelop-js.outputs.build_version }}
        shell: bash
        run: |
          gh release upload "$TAG" newIDE/electron-app/dist/*universal*.dmg --clobber

      - name: Dry-run summary
        if: ${{ env.DRY_RUN == 'true' }}
        shell: bash
        run: |
          echo "DRY RUN (macOS): skipped installs, stamp, electron-builder and release upload."
          echo "  build_version = ${{ needs.build-gdevelop-js.outputs.build_version }}"

  build-editor-linux:
    name: Build Editor (Linux portable)
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[force-build]'))
    needs: [build-gdevelop-js, prepare-release]
    runs-on: ubuntu-24.04
    env:
      # React production build runs out of heap without a larger Node heap -
      # same value as upstream's .circleci/config.yml Linux build job.
      NODE_OPTIONS: --max-old-space-size=7168
      # Force import-libGD.js to fail instead of silently falling back to
      # master/latest on S3 if our locally-placed libGD.js is missing.
      REQUIRES_EXACT_LIBGD_JS_VERSION: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        if: ${{ env.DRY_RUN != 'true' }}
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: |
            newIDE/app/package-lock.json
            newIDE/electron-app/package-lock.json
            newIDE/electron-app/app/package-lock.json

      # electron-builder's Linux packaging (icon conversion, AppImage/deb
      # tooling) needs these - same packages as upstream's .circleci/config.yml.
      - name: Install system deps for electron-builder
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y icnsutils graphicsmagick rsync

      # libGD.js / libGD.wasm are platform-independent (WebAssembly), so the
      # Linux-built artifact from build-gdevelop-js is reused as-is here too.
      - name: Download libGD.js artifact
        if: ${{ env.DRY_RUN != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: libGD-js
          path: Binaries/embuild/GDevelop.js

      # See the Windows job for the rationale.
      - name: Install shelljs for GDevelop.js copy script
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm install shelljs --no-save --no-package-lock
        working-directory: GDevelop.js

      - name: Install newIDE/app dependencies
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm install
        working-directory: newIDE/app

      - name: Install newIDE/electron-app dependencies
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm install
        working-directory: newIDE/electron-app

      # See the Windows job for the rationale.
      - name: Stamp build version
        if: ${{ env.DRY_RUN != 'true' }}
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.build-gdevelop-js.outputs.build_version }}
        run: |
          node -e "const f='newIDE/electron-app/app/package.json';const p=require('./'+f);p.version=process.env.BUILD_VERSION;require('fs').writeFileSync(f, JSON.stringify(p,null,2)+'\n')"
          echo "Stamped version: $BUILD_VERSION"

      # `--linux zip --x64` builds only the self-contained portable zip (no
      # installation, no code-signing), skipping the AppImage/deb installers
      # and the arm64 arch configured in electron-builder-config.js - mirrors
      # the "portable build" introduced upstream in 4ian/GDevelop#8587.
      # `--publish=never` keeps electron-builder from trying to upload a release.
      - name: Build editor portable zip (electron-builder)
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm run build -- --linux zip --x64 --publish=never
        working-directory: newIDE/electron-app

      # Attach the portable zip (e.g. "gdevelop-5.6.266-beta.42.zip") to the
      # release. --clobber makes re-runs of this job safe.
      - name: Attach Linux portable zip to release
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.build-gdevelop-js.outputs.build_version }}
        shell: bash
        run: |
          gh release upload "$TAG" newIDE/electron-app/dist/gdevelop-*.zip --clobber

      - name: Dry-run summary
        if: ${{ env.DRY_RUN == 'true' }}
        shell: bash
        run: |
          echo "DRY RUN (Linux): skipped installs, stamp, electron-builder and release upload."
          echo "  build_version = ${{ needs.build-gdevelop-js.outputs.build_version }}"
